name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
      - name: Check syntax
        run: |
          find . -name '*.php' -print0 | xargs -0 -n 1 php -l
          node --check public/script.js
      - name: Run tests
        run: php test.php
